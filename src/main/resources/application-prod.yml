spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chronosdb}
    username: ${DATABASE_USERNAME:chronos_user}
    password: ${DATABASE_PASSWORD:chronos_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
